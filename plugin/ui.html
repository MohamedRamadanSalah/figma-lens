<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #6b7280; --line: #e5e7eb;
    --accent: #5b5bd6; --accent-fg: #ffffff; --ok: #15803d; --bad: #b91c1c; --soft: #f5f5ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; font: 12px/1.45 Inter, system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  header b { font-size: 14px; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--line); color: var(--muted); }
  .pill.ok { background: #dcfce7; color: var(--ok); }
  .pill.bad { background: #fee2e2; color: var(--bad); }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
  #sel div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; }
  input[type=text], select { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; }
  input[type=text] { width: 170px; }
  button { width: 100%; padding: 10px; border: 0; border-radius: 10px; font: inherit; font-weight: 600;
           background: var(--accent); color: var(--accent-fg); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #log { margin-top: 10px; max-height: 150px; overflow: auto; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
  #log div { padding: 2px 0; border-bottom: 1px dashed var(--line); word-break: break-word; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .muted { color: var(--muted); }
</style>
</head>
<body>
  <header><b>Figma Lens</b><span id="bridge" class="pill">checking…</span></header>

  <div class="card">
    <div class="label">Selection</div>
    <div id="sel" class="muted">Select one or more frames</div>
  </div>

  <div class="card">
    <div class="row"><span>Screenshot scale</span>
      <select id="scale"><option value="1">1x</option><option value="2" selected>2x</option><option value="3">3x</option></select>
    </div>
    <div class="row"><label><input type="checkbox" id="css" checked /> Include CSS per layer</label></div>
    <div class="row"><label><input type="checkbox" id="sections" checked /> Section crops</label></div>
    <div class="row"><span>Bridge</span><input type="text" id="url" value="http://localhost:4141" /></div>
  </div>

  <button id="go" disabled>Export to Claude</button>
  <div id="log"></div>

<script>
  const $ = (id) => document.getElementById(id);
  let hasSelection = false;
  let busy = false;
  let queue = Promise.resolve();

  function log(text, cls) {
    const d = document.createElement('div');
    d.textContent = text;
    if (cls) d.className = cls;
    $('log').prepend(d);
  }
  function base() { return $('url').value.trim().replace(/\/+$/, ''); }
  function refreshButton() { $('go').disabled = busy || !hasSelection; }

  async function ping() {
    try {
      const r = await fetch(base() + '/health');
      const j = await r.json();
      if (!j.ok) throw new Error('bad reply');
      $('bridge').textContent = 'bridge on';
      $('bridge').className = 'pill ok';
      $('bridge').title = 'Writing to ' + j.outRoot;
    } catch (e) {
      $('bridge').textContent = 'bridge off';
      $('bridge').className = 'pill bad';
      $('bridge').title = 'Run: npm run bridge';
    }
  }
  ping();
  setInterval(ping, 4000);

  function toBase64(bytes) {
    let s = '';
    const CHUNK = 0x8000;
    for (let i = 0; i < bytes.length; i += CHUNK) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
    }
    return btoa(s);
  }

  async function send(p) {
    log('Sending "' + p.meta.nodeName + '" (' + p.files.length + ' files)…', 'muted');
    const body = JSON.stringify({
      meta: p.meta,
      spec: p.spec,
      tokens: p.tokens,
      files: p.files.map((f) => ({ path: f.path, base64: toBase64(f.bytes) })),
    });
    try {
      const r = await fetch(base() + '/export', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || 'HTTP ' + r.status);
      log('✔ ' + p.meta.nodeName + ' → ' + j.dir + ' (' + j.files + ' files)', 'ok');
      if (p.meta.warnings.length) log(p.meta.warnings.length + ' warning(s) — listed in spec.md', 'muted');
      if (p.meta.truncated) log('Layer limit reached — export a smaller frame for full detail', 'bad');
    } catch (e) {
      log('✖ ' + p.meta.nodeName + ': ' + e.message + ' — is the bridge running? (npm run bridge)', 'bad');
    }
  }

  onmessage = (ev) => {
    const m = ev.data && ev.data.pluginMessage;
    if (!m) return;
    if (m.type === 'selection') {
      hasSelection = m.items.length > 0;
      $('sel').innerHTML = '';
      if (!hasSelection) { $('sel').textContent = 'Select one or more frames'; $('sel').className = 'muted'; }
      else {
        $('sel').className = '';
        m.items.forEach((it) => {
          const d = document.createElement('div');
          d.textContent = it.name + ' · ' + it.type + ' · ' + it.w + '×' + it.h;
          $('sel').appendChild(d);
        });
      }
      refreshButton();
    } else if (m.type === 'progress') {
      log(m.text, 'muted');
    } else if (m.type === 'error') {
      log('✖ ' + m.message, 'bad');
    } else if (m.type === 'payload') {
      queue = queue.then(() => send(m.payload));
    } else if (m.type === 'done-reading') {
      queue = queue.then(() => { busy = false; refreshButton(); });
    }
  };

  $('go').onclick = () => {
    busy = true;
    refreshButton();
    parent.postMessage({ pluginMessage: { type: 'export', options: {
      scale: Number($('scale').value), css: $('css').checked, sections: $('sections').checked,
    } } }, '*');
  };
</script>
</body>
</html>
